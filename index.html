<!doctype html>
<html lang="fi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="HEROES-allianssin messupeli" />
    <title>HEROES Run</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #04201d;
        font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif;
      }
      #app {
        position: fixed;
        inset: 0;
        display: block;
      }
      canvas#stage {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        cursor: pointer;
        background: #04201d;
      }
      /* Latausruutu piilotetaan heti kun peli on valmis. */
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 1.2rem;
        justify-items: center;
        color: #f4f1e4;
        background: #04201d;
        transition: opacity 320ms ease;
      }
      #boot.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #boot h1 {
        margin: 0;
        font-size: clamp(2rem, 6vw, 4rem);
        letter-spacing: 0.14em;
        color: #f2e85c;
      }
      #boot p {
        margin: 0;
        font-size: clamp(0.9rem, 2vw, 1.2rem);
        opacity: 0.8;
      }
      #bootbar {
        width: min(60vw, 480px);
        height: 10px;
        border-radius: 999px;
        background: rgba(244, 241, 228, 0.16);
        overflow: hidden;
      }
      #bootbar > span {
        display: block;
        height: 100%;
        width: 0%;
        background: #2fb9a3;
        transition: width 160ms linear;
      }
    </style>
  </head>
  <body>
    <div id="app"><canvas id="stage"></canvas></div>
    <div id="boot">
      <h1>HEROES</h1>
      <div id="bootbar"><span></span></div>
      <p>Ladataan&hellip;</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
